<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Wubo</title>
<link href="https://cdn.jsdelivr.net/npm/gridstack@11/dist/gridstack.min.css" rel="stylesheet"/>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gridstack@11/dist/gridstack-all.js"></script>
<style>
  :root{
    --violet:#5914D0; --violet-soft:#F7F4FE; --violet-line:#C9B8F0;
    --jaune:#FFDD0B; --ink:#2B2B2B; --muted:#7A7A7A; --hint:#A0A0A0; --rule:#E2E2E2;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#ECECE9;font-family:var(--sans);color:var(--ink)}

  .bar{position:sticky;top:0;z-index:30;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;background:#fff;border-bottom:1px solid #DEDEDE}
  .bar .info{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .actions{display:flex;gap:8px;flex-shrink:0}
  .btn{font:inherit;font-size:13px;font-weight:500;cursor:pointer;border:none;border-radius:6px;padding:7px 14px;background:var(--violet);color:#fff}
  .btn.alt{background:#fff;color:var(--violet);border:1px solid var(--violet-line)}
  .btn:active{transform:scale(.98)}

  .canvas{padding:22px 14px;display:flex;justify-content:center}
  .page{width:794px;min-height:1123px;background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:2px;box-shadow:0 1px 6px rgba(0,0,0,.12);padding:54px 60px;display:flex;flex-direction:column;position:relative}
  .head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--jaune);padding-bottom:10px;margin-bottom:18px}
  .brand{display:flex;align-items:center}
  .brand img{height:42px;width:auto;display:block;-webkit-user-drag:none;user-drag:none}
  .meta{font-size:11px;color:var(--hint);text-align:right;line-height:1.5}

  /* ---- GridStack ---- */
  .grid-stack{flex:1;min-height:200px}
  .grid-stack-item-content{background:#fff;border-radius:6px;overflow:visible;display:flex;flex-direction:column;inset:0}
  .gridmount{position:relative}
  /* aide visuelle légère pendant l'édition */
  .grid-stack>.grid-stack-item>.grid-stack-item-content{box-shadow:0 0 0 1px transparent;transition:box-shadow .12s}
  .grid-stack>.grid-stack-item:hover>.grid-stack-item-content{box-shadow:0 0 0 1px var(--violet-line)}
  .grid-stack-item.grid-stack-placeholder>.placeholder-content{background:var(--violet-soft);border:1px dashed var(--violet-line);border-radius:6px}

  /* Toolbar par bloc (en haut à droite, dans le bloc → pas de clipping) */
  .bt{position:absolute;top:5px;right:5px;display:flex;gap:1px;background:#2B2B2B;border-radius:6px;padding:3px;z-index:7;box-shadow:0 2px 8px rgba(0,0,0,.28);opacity:0;visibility:hidden;transition:opacity .12s,visibility .12s;height:26px;align-items:center}
  .grid-stack-item:hover .bt,.bt:hover{opacity:1;visibility:visible}
  .bt .ic{background:transparent;color:#fff;border:none;width:22px;height:20px;border-radius:3px;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
  .bt .ic:hover{background:#444}
  .bt .ic svg{width:11px;height:11px}
  .bt .gs-drag{cursor:grab}
  .bt .gs-drag:active{cursor:grabbing}
  .bt .sep{width:1px;background:#555;margin:2px 1px;align-self:stretch}

  .blockbody{flex:1;min-height:0;overflow:auto;padding:2px}

  /* Layout KV */
  .kv .ttl{font-size:14px;font-weight:600;color:var(--violet);margin:0 0 6px;padding-bottom:4px;border-bottom:1px solid var(--rule);text-transform:uppercase;letter-spacing:.4px;outline:none}
  .kv .grid{display:grid;grid-template-columns:1fr 180px;gap:14px;align-items:start}
  .kv .grid.full{grid-template-columns:1fr}
  .kv .body{font-size:13.5px;line-height:1.6;outline:none}
  .kv .side{font-size:11.5px;color:#444;background:var(--violet-soft);border-left:3px solid var(--violet);padding:8px 10px;border-radius:0 4px 4px 0;line-height:1.5;outline:none}

  /* Layout CARD */
  .card{border:1px solid var(--rule);border-radius:6px;overflow:hidden;height:100%}
  .card .hd{background:var(--violet-soft);padding:9px 12px;border-bottom:1px solid var(--rule)}
  .card .hd .t{font-size:14px;font-weight:600;color:var(--violet);line-height:1.25;outline:none}
  .card .hd .st{font-size:11.5px;color:var(--muted);margin-top:2px;outline:none}
  .card .bd{padding:11px 12px}
  .card .attr{margin:0 0 8px}
  .card .attr:last-child{margin-bottom:0}
  .card .attr .k{font-size:10.5px;font-weight:600;color:var(--violet);text-transform:uppercase;letter-spacing:.4px;margin-bottom:1px}
  .card .attr .v{font-size:13px;line-height:1.55;outline:none}

  /* contenteditable feedback */
  [contenteditable]{cursor:text}
  [contenteditable]:empty:before{content:attr(data-placeholder);color:var(--hint);opacity:.5}
  [contenteditable]:focus{background:#FFFCE5;box-shadow:0 0 0 2px var(--jaune);border-radius:2px}
  [contenteditable] ul{margin:4px 0;padding-left:20px}
  [contenteditable] li{margin:2px 0}

  /* Block IMAGE */
  .imgblock{display:flex;flex-direction:column;width:100%;height:100%;border:1px solid var(--rule);border-radius:6px;background:#fff;overflow:hidden}
  .imgblock .imgwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#FAFAFA}
  .imgblock .imgwrap img{width:100%;height:100%;object-fit:contain;display:block;-webkit-user-drag:none;user-drag:none;pointer-events:none}
  .imgblock .cap{font-size:11px;color:var(--muted);text-align:center;outline:none;flex:0 0 auto;padding:0}
  .imgblock .cap:not(.cap-empty){padding:6px 10px;border-top:1px solid var(--rule)}
  .imgblock:hover .cap.cap-empty:not(:focus)::before{content:"+ légende";color:var(--hint);opacity:.45;display:block;padding:4px 10px;font-size:10px;border-top:1px dashed var(--rule)}

  /* Block TEXTE libre */
  .txtblock{font-size:13.5px;line-height:1.6;outline:none;min-height:36px;padding:8px 10px;border:1px dashed transparent;border-radius:5px}
  .txtblock:hover{border-color:var(--rule)}
  .txtblock:focus{border-color:var(--violet-line);border-style:solid;background:#fff}

  /* Fallback générique */
  .section h3{font-size:14px;font-weight:600;color:var(--violet);margin:0 0 7px;padding-bottom:4px;border-bottom:1px solid var(--rule)}
  .field{margin:0 0 9px}
  .field .k{font-size:11px;font-weight:600;color:var(--violet);text-transform:uppercase;letter-spacing:.5px}
  .field .v{font-size:13.5px;line-height:1.65;outline:none}

  .foot{display:flex;justify-content:space-between;border-top:1px solid var(--rule);margin-top:16px;padding-top:8px;font-size:10.5px;color:var(--hint)}
  .empty{color:var(--muted);font-size:14px;padding:40px;text-align:center}
  .err{color:#b00;font-size:12px;padding:10px 14px;background:#fff5f5;border:1px solid #f0caca;border-radius:6px;margin:6px 0;white-space:pre-wrap;font-family:Menlo,Consolas,monospace}

  /* Floating format toolbar */
  .fmttool{position:fixed;background:#2B2B2B;border-radius:6px;display:flex;gap:1px;padding:4px;z-index:80;box-shadow:0 3px 14px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .12s}
  .fmttool.show{opacity:1;pointer-events:auto}
  .fmttool button{background:transparent;color:#fff;border:none;width:30px;height:28px;border-radius:3px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;padding:0}
  .fmttool button:hover{background:#444}
  .fmttool button.b{font-weight:700}
  .fmttool button.i{font-style:italic}
  .fmttool button.u{text-decoration:underline}
  .fmttool button.s{text-decoration:line-through}
  .fmttool .sep{width:1px;background:#444;margin:2px 2px}
  .fmttool .swatch{position:relative}
  .fmttool .palette{position:absolute;top:32px;left:0;background:#2B2B2B;border-radius:4px;padding:5px;display:none;gap:4px;box-shadow:0 3px 10px rgba(0,0,0,.3)}
  .fmttool .swatch.open .palette{display:flex}
  .fmttool .palette span{width:18px;height:18px;border-radius:3px;cursor:pointer;border:1px solid #555}
  .fmttool .palette span:hover{transform:scale(1.1)}

  /* Undo toast */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2B2B2B;color:#fff;padding:11px 18px 13px;border-radius:6px;display:flex;gap:18px;align-items:center;font-size:13px;z-index:100;box-shadow:0 6px 22px rgba(0,0,0,.25);min-width:300px;overflow:hidden;animation:toast-in .18s ease-out}
  .toast .undo{cursor:pointer;color:var(--jaune);font-weight:600;letter-spacing:.3px;padding:2px 8px;border-radius:3px}
  .toast .undo:hover{background:rgba(255,221,11,.12)}
  .toast .progress{position:absolute;bottom:0;left:0;height:3px;background:var(--jaune);width:100%;transform-origin:left center;animation:toast-progress 5s linear forwards}
  @keyframes toast-in{from{transform:translate(-50%,12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
  @keyframes toast-progress{from{transform:scaleX(1)}to{transform:scaleX(0)}}

  /* File drop overlay */
  .page.file-hover{cursor:copy}
  .page.file-hover,.page.file-hover *{user-select:none!important}
  .page.file-hover::before{content:"Dépose pour insérer une image";position:absolute;inset:0;background:rgba(89,20,208,.06);border:3px dashed var(--violet);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--violet);font-weight:600;font-size:16px;letter-spacing:.5px;z-index:50;pointer-events:none}

  /* Print : on aplatit la grille en flux pour une vraie pagination A4 */
  #printroot{display:none}
  @media print{
    html,body{background:#fff}
    .bar,.fmttool,.toast,.grid-stack{display:none!important}
    .canvas{padding:0}
    .page{width:auto;min-height:auto;box-shadow:none;border:none;border-radius:0;padding:0 0 16mm}
    #printroot{display:flex;flex-wrap:wrap;align-items:flex-start}
    .printcell{box-sizing:border-box;padding:0 7px 14px;break-inside:avoid}
    .printcell .bt{display:none!important}
    [contenteditable]:focus{background:none;box-shadow:none}
    .foot{position:fixed;bottom:6mm;left:0;right:0;margin:0;padding:5px 0 0;border-top:1px solid var(--rule);background:#fff}
  }
  @page{size:A4;margin:14mm 14mm 22mm 14mm}
</style>
</head>
<body>
  <div class="bar">
    <div class="info" id="info">Connexion à Grist…</div>
    <div class="actions">
      <button class="btn alt" id="addtxt">+ Texte</button>
      <button class="btn alt" id="addimg">+ Image</button>
      <input type="file" id="fileinp" accept="image/*" style="display:none"/>
      <button class="btn alt" id="reset">Réinitialiser</button>
      <button class="btn alt" id="reload">Rafraîchir</button>
      <button class="btn" id="print">Imprimer / PDF A4</button>
    </div>
  </div>
  <div class="canvas">
    <div class="page" id="page">
      <div class="head">
        <div class="brand"><img src="WUBO-logo.png" alt="Wubo" draggable="false"/></div>
        <div class="meta" id="meta"></div>
      </div>
      <div class="grid-stack" id="grid"></div>
      <div id="printroot"></div>
      <div class="foot" id="foot"></div>
    </div>
  </div>

  <div class="fmttool" id="fmttool">
    <button class="b" data-cmd="bold" title="Gras (Ctrl+B)">B</button>
    <button class="i" data-cmd="italic" title="Italique (Ctrl+I)">I</button>
    <button class="u" data-cmd="underline" title="Souligné (Ctrl+U)">U</button>
    <button class="s" data-cmd="strikeThrough" title="Barré">S</button>
    <div class="sep"></div>
    <button id="hilite" title="Surligner (toggle)">
      <svg viewBox="0 0 14 14" width="14" height="14"><rect x="1" y="9" width="12" height="3" fill="#FFEB6E"/><path d="M3 8 L7 2 L11 8 Z" fill="none" stroke="#fff" stroke-width="1.3"/></svg>
    </button>
    <div class="swatch" id="colorswatch">
      <button title="Couleur du texte"><span style="font-weight:700;color:#fff">A</span><span style="display:inline-block;width:9px;height:3px;background:#FF3D3D;margin-left:1px"></span></button>
      <div class="palette">
        <span data-color="#2B2B2B" style="background:#2B2B2B"></span>
        <span data-color="#5914D0" style="background:#5914D0"></span>
        <span data-color="#0066D9" style="background:#0066D9"></span>
        <span data-color="#1B9E3F" style="background:#1B9E3F"></span>
        <span data-color="#FF3D3D" style="background:#FF3D3D"></span>
        <span data-color="#E67E00" style="background:#E67E00"></span>
        <span data-color="#7A7A7A" style="background:#7A7A7A"></span>
      </div>
    </div>
    <div class="sep"></div>
    <button data-cmd="insertUnorderedList" title="Liste à puces">
      <svg viewBox="0 0 14 14" width="14" height="14" fill="#fff"><circle cx="2" cy="3" r="1.2"/><circle cx="2" cy="7" r="1.2"/><circle cx="2" cy="11" r="1.2"/><rect x="5" y="2.3" width="8" height="1.4"/><rect x="5" y="6.3" width="8" height="1.4"/><rect x="5" y="10.3" width="8" height="1.4"/></svg>
    </button>
  </div>

  <div id="toast-host"></div>

<script>
(function(){
  "use strict";
  var VER="v10";

  var TABLE_CONFIG = {
    "T01_identite":{label:"Identité",layout:"kv",title:["Rubrique","Rubrique"],body:["Contenu","Contenu"]},
    "T02_ecosysteme_produit":{label:"Écosystème produit",layout:"card",title:["Pilier","Pilier"],fields:[["Description","Description"],["Role_pedagogique","Rôle pédagogique"],["Exemples_concrets","Exemples concrets"],["Argument_parent","Argument parent"]]},
    "T03_univers_narratif":{label:"Univers narratif",layout:"card",title:["Element","Élément"],subtitle:["Type","Type"],fields:[["Description","Description"],["Role_dans_le_produit","Rôle dans le produit"]]},
    "T04_blocs_modulaires":{label:"Blocs modulaires",layout:"card",title:["Bloc","Bloc"],subtitle:["Audience","Audience"],fields:[["Formulation","Formulation"],["Usage_recommande","Usage recommandé"]]},
    "T05_pitchs":{label:"Pitchs",layout:"card",title:["Type_de_pitch","Type de pitch"],subtitle:["Duree_Format","Durée / Format"],fields:[["Formulation_complete","Formulation complète"],["Contexte_d_usage","Contexte d'usage"]]},
    "T06_business_model":{label:"Business model",layout:"kv",title:["Rubrique","Rubrique"],body:["Detail","Détail"],side:["Chiffres_cles","Chiffres clés"]},
    "T07_concurrence":{label:"Concurrence",layout:"card",title:["Concurrent","Concurrent"],subtitle:["Type","Type"],fields:[["Famille","Famille"],["Presence_FR","Présence FR"],["Prix","Prix"],["Forces","Forces"],["Faiblesses","Faiblesses"],["Positionnement_Wubo_vs","Positionnement Wubo vs"]]},
    "T08_equipe_legal":{label:"Équipe & légal",layout:"kv",title:["Rubrique","Rubrique"],body:["Detail","Détail"],side:["Role_Statut","Rôle / Statut"]},
    "T09_audiences":{label:"Audiences",layout:"card",title:["Audience","Audience"],subtitle:["Sous_segment","Sous-segment"],fields:[["Motivation_principale","Motivation principale"],["Frein_principal","Frein principal"],["Argument_massue","Argument massue"],["Canal_prioritaire","Canal prioritaire"],["Budget_moyen","Budget moyen"],["Profil_com","Profil com"]]},
    "T10_kits_roadmap":{label:"Kits & roadmap",layout:"card",title:["Kit","Kit"],subtitle:["Nom_capsule","Nom capsule"],fields:[["Statut","Statut"],["Thematique","Thématique"],["Notions_cles","Notions clés"],["Mascotte","Mascotte"],["COGS_cible_","COGS cible (€)"],["Prix_HT_","Prix HT (€)"],["Marge_brute_","Marge brute %"],["Lancement_prevu","Lancement prévu"]]},
    "T11_traction_metriques":{label:"Traction & métriques",layout:"card",title:["Metrique","Métrique"],subtitle:["Categorie","Catégorie"],fields:[["Valeur_actuelle_Preuve","Valeur actuelle / Preuve"],["Objectif_cible","Objectif cible"],["Source","Source"]]},
    "T12_canvas_frameworks":{label:"Canvas & frameworks",layout:"card",title:["Framework","Framework"],subtitle:["Bloc","Bloc"],fields:[["Contenu","Contenu"]]},
    "T13_risques":{label:"Risques",layout:"card",title:["Risque","Risque"],subtitle:["Categorie","Catégorie"],fields:[["Probabilite","Probabilité"],["Impact","Impact"],["Score","Score (PxI)"],["Mitigation","Plan de mitigation"],["Owner","Owner"],["Statut","Statut"]]}
  };

  var COLS=12, CELL=30, GUTTER_PX=12, PAGE_INNER=674;
  var GLOBAL_SKIP=/^(Notes|manualSort|id|gristHelper)/i;
  var allRecords=[], tableId="", lastError="", lastSaved="";
  // Modèle : blocks (métadonnées par clé) + layout (positions GridStack) + hidden (recId masqués)
  var state={blocks:{},layout:[],hidden:{}};
  var recordsLoaded=false, optionsLoaded=false, tableLoaded=false, didInit=false, autosave=false, building=false;
  var graceTimer=null;
  var grid=null, gridEl=document.getElementById("grid");
  var infoEl=document.getElementById("info");
  var pageEl=document.getElementById("page");
  var toastHost=document.getElementById("toast-host");
  var currentToast=null;
  var saveTimer=null, lastPersisted="";

  // ========================= UTILITIES =========================
  function el(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n;}
  function clear(n){while(n.firstChild)n.removeChild(n.firstChild);}
  function isEmpty(v){return v===null||v===undefined||v===""||(Array.isArray(v)&&v.length<=1);}
  function uid(){return Math.random().toString(36).slice(2,9);}
  function clone(o){return JSON.parse(JSON.stringify(o));}
  function readVal(rec,id){if(rec[id]!==undefined)return rec[id];var keys=Object.keys(rec);for(var i=0;i<keys.length;i++)if(keys[i].toLowerCase()===id.toLowerCase())return rec[keys[i]];return undefined;}
  function recById(id){for(var i=0;i<allRecords.length;i++)if(allRecords[i].id===id)return allRecords[i];return null;}
  function fmtNum(v,id){
    if(typeof v!=="number")return String(v);
    if(/marge|pct|percent|%/i.test(id))return (v*100).toFixed(1).replace(/\.0$/,"")+" %";
    if(Number.isInteger(v))return String(v);
    return v.toLocaleString("fr-FR",{maximumFractionDigits:2});
  }
  function iconX(){var s='<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 2 L8 8 M8 2 L2 8"/></svg>';var d=document.createElement("div");d.innerHTML=s;return d.firstChild;}
  function iconDots(){var s='<svg viewBox="0 0 8 12" fill="currentColor"><circle cx="2" cy="2" r="1"/><circle cx="6" cy="2" r="1"/><circle cx="2" cy="6" r="1"/><circle cx="6" cy="6" r="1"/><circle cx="2" cy="10" r="1"/><circle cx="6" cy="10" r="1"/></svg>';var d=document.createElement("div");d.innerHTML=s;return d.firstChild;}

  // ========================= SAFE HTML =========================
  var ALLOWED_TAGS = {"B":1,"STRONG":1,"I":1,"EM":1,"U":1,"S":1,"STRIKE":1,"MARK":1,"SPAN":1,"BR":1,"UL":1,"OL":1,"LI":1,"DIV":1,"P":1,"FONT":1};
  function cleanDomNode(node){
    var children = Array.prototype.slice.call(node.childNodes);
    for(var i=0;i<children.length;i++){
      var c=children[i];
      if(c.nodeType===3)continue;
      if(c.nodeType!==1){c.remove();continue;}
      var tag=c.tagName.toUpperCase();
      if(!ALLOWED_TAGS[tag]){
        var p=c.parentNode;
        while(c.firstChild)p.insertBefore(c.firstChild,c);
        c.remove();continue;
      }
      if(tag==="FONT"){
        var col=c.getAttribute("color");
        var span=document.createElement("span");
        if(col)span.style.color=col;
        while(c.firstChild)span.appendChild(c.firstChild);
        c.replaceWith(span);
        cleanDomNode(span);
        continue;
      }
      var attrs=Array.prototype.slice.call(c.attributes);
      for(var j=0;j<attrs.length;j++){
        var a=attrs[j];
        if(a.name==="style"){
          var color=c.style.color, bg=c.style.backgroundColor, td=c.style.textDecoration, fw=c.style.fontWeight, fs=c.style.fontStyle;
          c.removeAttribute("style");
          if(color)c.style.color=color;
          if(bg&&bg!=="transparent"&&bg!=="rgba(0, 0, 0, 0)")c.style.backgroundColor=bg;
          if(td)c.style.textDecoration=td;
          if(fw)c.style.fontWeight=fw;
          if(fs)c.style.fontStyle=fs;
        }else{
          c.removeAttribute(a.name);
        }
      }
      cleanDomNode(c);
    }
  }
  function parseAndClean(html){
    var doc=new DOMParser().parseFromString("<div id='r'>"+(html||"")+"</div>","text/html");
    var root=doc.getElementById("r");
    if(!root)return document.createDocumentFragment();
    cleanDomNode(root);
    var frag=document.createDocumentFragment();
    while(root.firstChild)frag.appendChild(root.firstChild);
    return frag;
  }
  function setSafeHtml(node,html){while(node.firstChild)node.firstChild.remove();node.appendChild(parseAndClean(html));}
  function getSafeHtml(node){var cl=node.cloneNode(true);cleanDomNode(cl);return cl.innerHTML;}
  function hasHtml(s){return typeof s==="string"&&/<[a-z!\/]/i.test(s);}
  function setContent(node,value){if(value==null){node.textContent="";return;}var str=String(value);if(hasHtml(str))setSafeHtml(node,str);else node.textContent=str;}
  function hasFormatting(html){return /<(b|i|u|s|strike|strong|em|mark|ul|ol|li|span|font)/i.test(html);}

  // ========================= INLINE EDIT (Grist) =========================
  function makeEditable(node,recId,colId){
    if(!node||recId==null||!colId)return;
    node.setAttribute("contenteditable","true");
    node.dataset.rec=String(recId);node.dataset.col=colId;
    node.dataset.orig=getSafeHtml(node);node.spellcheck=false;
    node.addEventListener("focus",function(){node.dataset.orig=getSafeHtml(node);});

  // ========================= STATE / RECONCILE =========================
  function recKey(recId){return "r"+recId;}
  function layoutById(id){for(var i=0;i<state.layout.length;i++)if(state.layout[i].id===id)return state.layout[i];return null;}
  function defaultNode(key){
    var b=state.blocks[key];
    if(!b)return {id:key,w:12};
    if(b.type==="record"){var cfg=TABLE_CONFIG[tableId];return {id:key,w:(cfg&&cfg.layout==="card")?6:12};}
    if(b.type==="image")return {id:key,w:b._w||4,h:b._h||6};
    return {id:key,w:12};
  }
  function reconcile(){
    if(!recordsLoaded)return;
    var valid={};
    allRecords.forEach(function(rec){
      valid[rec.id]=true;
      var key=recKey(rec.id);
      if(!state.hidden[rec.id]&&!state.blocks[key])state.blocks[key]={type:"record",recId:rec.id};
    });
    Object.keys(state.blocks).forEach(function(key){var b=state.blocks[key];if(b.type==="record"&&!valid[b.recId])delete state.blocks[key];});
    // layout : retire les entrées orphelines, ajoute celles manquantes
    state.layout=state.layout.filter(function(n){return state.blocks[n.id];});
    Object.keys(state.blocks).forEach(function(key){if(!layoutById(key))state.layout.push(defaultNode(key));});
  }

  function removeBlock(key){
    var b=state.blocks[key];if(!b)return;
    var snap=clone(state);
    if(b.type==="record")state.hidden[b.recId]=true;
    delete state.blocks[key];
    state.layout=state.layout.filter(function(n){return n.id!==key;});
    render();persist();
    showUndoToast("Bloc masqué", function(){state.blocks=snap.blocks;state.layout=snap.layout;state.hidden=snap.hidden;persist();});
  }

  // ========================= GRID RENDER =========================
  var GRID_OPTS={
    column:COLS, cellHeight:CELL, margin:GUTTER_PX/2, float:true, animate:true,
    sizeToContent:true,
    draggable:{handle:".gs-drag",scroll:false},
    resizable:{handles:"e,se,s,sw,w"},
    minRow:1
  };
  function onGridChange(){if(building||!autosave)return;syncLayout();scheduleSave();}
  function syncLayout(){
    if(!grid)return;
    var nodes=grid.save(false)||[];
    var byId={};nodes.forEach(function(n){if(n.id)byId[n.id]={id:n.id,x:n.x,y:n.y,w:n.w,h:n.h};});
    // garde les métadonnées de taille image (_w/_h) dans blocks, positions dans layout
    state.layout=state.layout.map(function(n){return byId[n.id]||n;});
    // ajoute toute node nouvelle
    Object.keys(byId).forEach(function(id){if(!layoutById(id))state.layout.push(byId[id]);});
    // resynchronise la taille mémorisée des images après resize
    Object.keys(byId).forEach(function(id){var b=state.blocks[id];if(b&&b.type==="image"){b._w=byId[id].w;b._h=byId[id].h;}});
  }

  function render(){
    try{
      reconcile();
      renderMeta();renderFoot();updateInfo();
      if(grid){try{grid.offAll&&grid.offAll();grid.destroy(false);}catch(e){}grid=null;}
      clear(gridEl);
      if(lastError)gridEl.appendChild(el("div","err","⚠ "+lastError));
      if(!allRecords.length&&!state.layout.length){
        gridEl.appendChild(el("div","empty","Aucune ligne dans cette table. Ajoute des lignes côté Grist puis Rafraîchir."));
        return;
      }
      for(var i=0;i<state.layout.length;i++){
        var n=state.layout[i];var b=state.blocks[n.id];if(!b)continue;
        var item=el("div","grid-stack-item");
        item.setAttribute("gs-id",n.id);
        if(n.x!=null)item.setAttribute("gs-x",n.x);
        if(n.y!=null)item.setAttribute("gs-y",n.y);
        item.setAttribute("gs-w",n.w||4);
        if(n.h!=null)item.setAttribute("gs-h",n.h);
        if(b.type==="image")item.setAttribute("gs-size-to-content","false");
        var c=el("div","grid-stack-item-content");

      building=true;
      grid=GridStack.init(GRID_OPTS, gridEl);
      grid.on("change",onGridChange);
      grid.on("added",onGridChange);
      grid.on("removed",onGridChange);

      setTimeout(function(){building=false;syncLayout();if(autosave)scheduleSave();},0);
    }catch(e){lastError="render : "+(e&&e.message||e);updateInfo();}
  }

  // ========================= PERSIST / LOAD =========================
  function payload(){return {v:VER,blocks:state.blocks,layout:state.layout,hidden:state.hidden};}
  // Sérialisation canonique : même ordre de clés des deux côtés pour fiabiliser la détection d'écho
  function canon(o){
    o=o||{};
    var lay=(Array.isArray(o.layout)?o.layout:[]).map(function(n){
      return {id:n.id,x:(n.x==null?null:n.x),y:(n.y==null?null:n.y),w:(n.w==null?null:n.w),h:(n.h==null?null:n.h)};
    });
    return JSON.stringify({v:o.v||VER,blocks:o.blocks||{},layout:lay,hidden:o.hidden||{}});
  }
  function persist(){
    if(typeof grist==="undefined")return;
    var data=payload();var s=canon(data);
    if(s===lastPersisted)return;
    lastPersisted=s;
    var setter=null;
    if(grist.setOption)setter=grist.setOption.bind(grist);
    else if(grist.widgetApi&&grist.widgetApi.setOption)setter=grist.widgetApi.setOption.bind(grist.widgetApi);
    if(!setter){lastError="setOption indisponible";updateInfo();return;}
    try{
      var p=setter("atlas",data);
      if(p&&p.then)p.then(function(){lastSaved=new Date().toLocaleTimeString("fr-FR");lastError="";updateInfo();}).catch(function(e){lastError="sauvegarde : "+(e&&e.message||e);updateInfo();});
      else{lastSaved=new Date().toLocaleTimeString("fr-FR");updateInfo();}
    }catch(e){lastError="persist : "+(e&&e.message||e);updateInfo();}
  }
  function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(persist,250);}
  function sanitizeBlocks(obj){
    var out={};if(!obj||typeof obj!=="object")return out;
    Object.keys(obj).forEach(function(k){
      var b=obj[k];if(!b)return;
      if(b.type==="record"&&typeof b.recId==="number")out[k]={type:"record",recId:b.recId};
      else if(b.type==="image"&&(b.attId!=null||b.dataUrl))out[k]={type:"image",attId:b.attId||null,dataUrl:b.dataUrl||null,caption:b.caption||"",_w:b._w||null,_h:b._h||null};
      else if(b.type==="text")out[k]={type:"text",html:b.html||""};
    });
    return out;
  }
  function loadFromAtlas(a){
    if(!a||typeof a!=="object")return;
    state.blocks=sanitizeBlocks(a.blocks);
    state.hidden=(a.hidden&&typeof a.hidden==="object")?a.hidden:{};
    var lay=[];
    if(Array.isArray(a.layout))a.layout.forEach(function(n){if(n&&state.blocks[n.id])lay.push({id:n.id,x:n.x,y:n.y,w:n.w,h:n.h});});
    state.layout=lay;
  }

  // ========================= IMAGE COMPRESS / INSERT =========================
  function readFileAsDataURL(file){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(fr.result);};fr.onerror=function(){rej(new Error("read"));};fr.readAsDataURL(file);});}
  function loadImg(src){return new Promise(function(res,rej){var i=new Image();i.onload=function(){res(i);};i.onerror=function(){rej(new Error("img"));};i.src=src;});}
  async function compressImage(file,maxDim){
    if(file.type==="image/svg+xml"){var url=await readFileAsDataURL(file);return {dataUrl:url,width:0,height:0};}
    var dataUrl=await readFileAsDataURL(file);var img=await loadImg(dataUrl);
    var ow=img.width,oh=img.height,w=ow,h=oh;
    if(!(w<=maxDim&&h<=maxDim&&file.size<500*1024)){
      if(w>=h){if(w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;}}else{if(h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;}}
      var c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
      var keepAlpha=(file.type==="image/png"||file.type==="image/gif"||file.type==="image/webp");
      dataUrl=c.toDataURL(keepAlpha?"image/png":"image/jpeg",keepAlpha?undefined:0.85);
    }
    return {dataUrl:dataUrl,width:ow,height:oh};
  }
  async function insertImage(file){
    if(!file||!file.type||file.type.indexOf("image/")!==0){lastError="format image non supporté";updateInfo();return;}
    try{
      var attId=null;
      if(grist&&grist.docApi&&typeof grist.docApi.uploadAttachment==="function"){
        try{var res=await grist.docApi.uploadAttachment(file);attId=Array.isArray(res)?res[0]:res;}catch(e){attId=null;}
      }
      var w=4, pxPerCol=PAGE_INNER/COLS, dispW=w*pxPerCol;
      var block, h=6;
      if(attId){block={type:"image",attId:attId,caption:"",_w:w,_h:h};}
      else{
        var comp=await compressImage(file,1600);if(!comp||!comp.dataUrl){lastError="lecture image impossible";updateInfo();return;}
        var natW=comp.width||dispW, natH=comp.height||dispW;
        var dispH=dispW*natH/natW;h=Math.max(3,Math.round((dispH+34)/CELL));
        block={type:"image",dataUrl:comp.dataUrl,caption:"",_w:w,_h:h};
      }
      var key=uid();state.blocks[key]=block;state.layout.push({id:key,w:w,h:h});
      render();
      lastError="";updateInfo();
    }catch(e){lastError="image : "+(e&&e.message||e);updateInfo();}
  }

  // File drag & drop sur la page
  var dragCounter=0;
  function isFileDrag(e){if(!e.dataTransfer||!e.dataTransfer.types)return false;var t=e.dataTransfer.types;for(var i=0;i<t.length;i++)if(t[i]==="Files")return true;return false;}
  pageEl.addEventListener("dragenter",function(e){if(!isFileDrag(e))return;dragCounter++;pageEl.classList.add("file-hover");e.preventDefault();});
  pageEl.addEventListener("dragleave",function(e){if(!isFileDrag(e))return;dragCounter=Math.max(0,dragCounter-1);if(dragCounter===0)pageEl.classList.remove("file-hover");});
  pageEl.addEventListener("dragover",function(e){if(!isFileDrag(e))return;e.preventDefault();});
  pageEl.addEventListener("drop",async function(e){
    if(!isFileDrag(e))return;
    if(!e.dataTransfer||!e.dataTransfer.files||!e.dataTransfer.files.length)return;
    e.preventDefault();dragCounter=0;pageEl.classList.remove("file-hover");
    try{window.getSelection().removeAllRanges();}catch(err){}
    var files=Array.prototype.filter.call(e.dataTransfer.files,function(f){return f.type&&f.type.indexOf("image/")===0;});
    if(!files.length){lastError="aucune image dans le drop";updateInfo();return;}
    for(var k=0;k<files.length;k++){await insertImage(files[k]);}
  });

  function pickImage(){document.getElementById("fileinp").click();}
  function onFileChange(e){var file=e.target.files&&e.target.files[0];e.target.value="";if(!file)return;insertImage(file);}

  // ========================= TEXTE LIBRE =========================
  function addTextBlock(){
    var key=uid();state.blocks[key]={type:"text",html:""};state.layout.push({id:key,w:12});
    render();
    setTimeout(function(){var els=gridEl.querySelectorAll(".txtblock");if(els.length)els[els.length-1].focus();},60);
  }

  // ========================= RESET =========================
  function resetLayout(){
    var snap=clone(state);
    state.blocks={};state.layout=[];state.hidden={};
    render();persist();
    showUndoToast("Mise en page réinitialisée", function(){state.blocks=snap.blocks;state.layout=snap.layout;state.hidden=snap.hidden;persist();});
  }

  // ========================= PRINT (aplatissement en flux) =========================
  function buildPrintLayout(){
    var root=document.getElementById("printroot");clear(root);
    var nodes=grid?(grid.save(false)||[]):[];
    nodes=nodes.slice().sort(function(a,b){return (a.y-b.y)||(a.x-b.x);});
    nodes.forEach(function(n){
      var src=gridEl.querySelector('[gs-id="'+n.id+'"] .blockbody');
      if(!src)return;
      var cell=el("div","printcell");
      cell.style.flexBasis=((n.w||12)/COLS*100)+"%";
      cell.style.maxWidth=((n.w||12)/COLS*100)+"%";
      cell.appendChild(src.cloneNode(true));
      root.appendChild(cell);
    });
  }
  window.addEventListener("beforeprint",buildPrintLayout);

  // ========================= BUTTONS =========================
  document.getElementById("print").addEventListener("click",function(){buildPrintLayout();window.print();});
  document.getElementById("reload").addEventListener("click",function(){lastError="";render();});
  document.getElementById("addimg").addEventListener("click",pickImage);
  document.getElementById("addtxt").addEventListener("click",addTextBlock);
  document.getElementById("fileinp").addEventListener("change",onFileChange);
  document.getElementById("reset").addEventListener("click",resetLayout);

  // ========================= INIT =========================
  if(typeof grist==="undefined"){
    infoEl.textContent="Hors Grist · ouvre cette URL comme Custom Widget ("+VER+")";
    gridEl.appendChild(el("div","empty","Ouvre cette page comme widget personnalisé dans Grist (Custom + Full document access)."));
    return;
  }
  if(typeof GridStack==="undefined"){
    infoEl.textContent="Erreur : GridStack non chargé (CDN bloqué ?)";
    return;
  }
  // On ne construit (et surtout on ne sauvegarde) qu'une fois données + options + table chargées.
  // Sinon onRecords arrivant avant onOptions crée une mise en page par défaut qui écrase l'état réel.
  function maybeInit(){
    if(didInit)return;
    if(recordsLoaded&&optionsLoaded&&tableLoaded){
      didInit=true;clearTimeout(graceTimer);
      render();
      setTimeout(function(){autosave=true;},80); // autorise la sauvegarde APRÈS le 1er rendu
    }
  }
  try{grist.ready({requiredAccess:"full"});}catch(e){lastError="ready : "+e.message;}
  // filet de sécurité : si une source ne répond pas, on démarre quand même après 2,5 s
  graceTimer=setTimeout(function(){
    if(didInit)return;
    recordsLoaded=true;optionsLoaded=true;tableLoaded=true;didInit=true;
    render();setTimeout(function(){autosave=true;},80);
  },2500);

  grist.onRecords(function(records){try{allRecords=records||[];recordsLoaded=true;if(didInit)render();else maybeInit();}catch(e){lastError="onRecords : "+e.message;updateInfo();}});
  if(grist.onOptions){
    grist.onOptions(function(opts){
      try{
        var a=opts&&opts.atlas;
        var s=a?canon(a):"";
        if(optionsLoaded&&s&&s===lastPersisted)return; // écho de notre propre setOption : on ignore
        if(a)loadFromAtlas(a);
        lastPersisted=s;
        optionsLoaded=true;
        if(didInit)render();else maybeInit();
      }catch(e){lastError="onOptions : "+e.message;updateInfo();}
    });
  }else{optionsLoaded=true;}
  try{grist.getTable&&grist.getTable().getTableId().then(function(id){tableId=id;tableLoaded=true;if(didInit)render();else maybeInit();}).catch(function(e){lastError="getTableId : "+e.message;tableLoaded=true;maybeInit();updateInfo();});}catch(e){lastError="getTable : "+e.message;tableLoaded=true;maybeInit();}
})();
</script>
</body>
</html>
