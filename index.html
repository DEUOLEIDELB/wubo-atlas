<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Wubo · Lecture A4</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root{
    --violet:#5914D0; --violet-soft:#F7F4FE; --violet-line:#C9B8F0;
    --jaune:#FFDD0B; --ink:#2B2B2B; --muted:#7A7A7A; --hint:#A0A0A0; --rule:#E2E2E2;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#ECECE9;font-family:var(--sans);color:var(--ink)}
  .bar{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:10px 14px;background:#fff;border-bottom:1px solid #DEDEDE}
  .btn{font:inherit;font-size:13px;font-weight:500;cursor:pointer;border:none;border-radius:6px;padding:7px 14px;background:var(--violet);color:#fff}
  .btn.alt{background:#fff;color:var(--violet);border:1px solid var(--violet-line)}
  .btn:active{transform:scale(.98)}
  .canvas{padding:22px 14px;display:flex;justify-content:center}
  .page{width:794px;min-height:1123px;background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:2px;box-shadow:0 1px 6px rgba(0,0,0,.12);padding:54px 60px}
  .head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--jaune);padding-bottom:10px;margin-bottom:24px}
  .brand{display:flex;align-items:center}
  .brand img{height:42px;width:auto;display:block}
  .meta{font-size:11px;color:var(--hint);text-align:right;line-height:1.5}
  .section{margin:0 0 18px;break-inside:avoid}
  .section h3{font-size:14px;font-weight:600;color:var(--violet);margin:0 0 7px;padding-bottom:4px;border-bottom:1px solid var(--rule)}
  .field{margin:0 0 9px}
  .field .k{font-size:11px;font-weight:600;color:var(--violet);text-transform:uppercase;letter-spacing:.5px}
  .field .v{font-size:13.5px;line-height:1.65;white-space:pre-wrap;margin-top:1px}
  .imgwrap{margin:10px 0}
  .imgwrap img{max-width:100%;border:1px solid var(--rule);border-radius:6px;display:block}
  .imgzone{border:1.5px dashed var(--violet-line);background:var(--violet-soft);border-radius:6px;padding:16px;text-align:center;color:var(--violet);font-size:12px}
  .foot{display:flex;justify-content:space-between;border-top:1px solid var(--rule);margin-top:30px;padding-top:8px;font-size:10.5px;color:var(--hint)}
  .empty{color:var(--muted);font-size:14px;padding:40px;text-align:center}
  @media print{html,body{background:#fff}.bar{display:none}.canvas{padding:0}.page{width:auto;min-height:auto;box-shadow:none;border:none;border-radius:0;padding:0}}
  @page{size:A4;margin:16mm}
</style>
</head>
<body>
  <div class="bar">
    <button class="btn alt" id="reload">Rafraîchir</button>
    <button class="btn" id="print">Imprimer / PDF A4</button>
  </div>
  <div class="canvas"><div class="page" id="page"></div></div>
<script>
(function(){
  "use strict";
  var allRecords=[], tableId="";
  var SKIP=["id","manualSort"];
  var TITLE_KEYS=["rubrique","titre","title","nom","name","concurrent","kit","bloc","metrique","risque","pilier","audience","sous_segment","source","indicateur","framework","objectif","poste"];
  function prettify(id){return String(id).replace(/^t\d+_/i,"").replace(/_/g," ").replace(/\s+/g," ").trim().replace(/^./,function(c){return c.toUpperCase();});}
  function isSkipped(k){return SKIP.indexOf(k)>=0||k.indexOf("gristHelper")===0;}
  function isEmpty(v){return v===null||v===undefined||v===""||(Array.isArray(v)&&v.length<=1);}
  function isAttach(v){return Array.isArray(v)&&v[0]==="L";}
  function keysOf(rec){return Object.keys(rec).filter(function(k){return !isSkipped(k);});}
  function pickTitleKey(keys){for(var i=0;i<keys.length;i++){if(TITLE_KEYS.indexOf(keys[i].toLowerCase())>=0)return keys[i];}for(var j=0;j<keys.length;j++){if(!isSkipped(keys[j]))return keys[j];}return null;}
  function clear(node){while(node.firstChild)node.removeChild(node.firstChild);}
  function el(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n;}
  function emptyMsg(text){var e=el("div","empty",text);return e;}
  async function renderAttachment(ids){
    var frag=el("div","imgwrap"); var shown=false;
    for(var i=1;i<ids.length;i++){
      var url=null;
      try{if(grist.docApi&&typeof grist.docApi.getAttachmentURL==="function"){url=await grist.docApi.getAttachmentURL(ids[i]);}}catch(e){url=null;}
      if(url){var im=document.createElement("img");im.src=url;im.alt="Image";frag.appendChild(im);shown=true;}
    }
    if(!shown){return el("div","imgzone","Image insérée dans Grist (s'affiche ici en accès complet au document).");}
    return frag;
  }
  async function sectionFromRecord(rec){
    var sec=el("div","section");
    var keys=keysOf(rec); var titleKey=pickTitleKey(keys);
    sec.appendChild(el("h3",null,titleKey?(rec[titleKey]||prettify(titleKey)):"Élément"));
    for(var i=0;i<keys.length;i++){
      var k=keys[i]; if(k===titleKey) continue;
      var v=rec[k]; if(isEmpty(v)) continue;
      var f=el("div","field");
      f.appendChild(el("div","k",prettify(k)));
      if(isAttach(v)){f.appendChild(await renderAttachment(v));}
      else{f.appendChild(el("div","v",String(v)));}
      sec.appendChild(f);
    }
    return sec;
  }
  async function render(){
    var page=document.getElementById("page");
    clear(page);
    var head=el("div","head");
    var brand=el("div","brand");
    var logo=document.createElement("img"); logo.src="WUBO-logo.png"; logo.alt="Wubo"; brand.appendChild(logo);
    var meta=el("div","meta");
    var d=new Date();
    var mm=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
    meta.appendChild(document.createTextNode("Document généré depuis Grist"));
    meta.appendChild(document.createElement("br"));
    meta.appendChild(document.createTextNode(d.getDate()+" "+mm[d.getMonth()]+" "+d.getFullYear()));
    head.appendChild(brand); head.appendChild(meta); page.appendChild(head);
    if(!allRecords.length){page.appendChild(emptyMsg("Aucune ligne dans cette table."));return;}
    for(var i=0;i<allRecords.length;i++){page.appendChild(await sectionFromRecord(allRecords[i]));}
    var foot=el("div","foot");
    foot.appendChild(el("span",null,"Wubo · Strasbourg"));
    foot.appendChild(el("span",null,"Source : Grist · "+(tableId||"")));
    foot.appendChild(el("span",null,"Généré le "+d.toLocaleDateString("fr-FR")));
    page.appendChild(foot);
  }
  document.getElementById("print").addEventListener("click",function(){window.print();});
  document.getElementById("reload").addEventListener("click",render);
  var page=document.getElementById("page");
  if(typeof grist==="undefined"){
    page.appendChild(emptyMsg("Ouvre cette page comme widget personnalisé dans Grist (Ajouter une section, Custom, URL), accès Full document access."));
    return;
  }
  page.appendChild(emptyMsg("Connexion à Grist…"));
  grist.ready({requiredAccess:"full"});
  grist.onRecords(function(records){ allRecords=records||[]; render(); });
  try{ grist.getTable&&grist.getTable().getTableId().then(function(id){tableId=id;render();}); }catch(e){}
})();
</script>
</body>
</html>
