<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Wubo · Lecture A4</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
  :root{
    --violet:#5914D0; --violet-soft:#F7F4FE; --violet-line:#C9B8F0;
    --jaune:#FFDD0B; --ink:#2B2B2B; --muted:#7A7A7A; --hint:#A0A0A0; --rule:#E2E2E2;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#ECECE9;font-family:var(--sans);color:var(--ink)}

  .bar{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;background:#fff;border-bottom:1px solid #DEDEDE}
  .bar .info{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .actions{display:flex;gap:8px;flex-shrink:0}
  .btn{font:inherit;font-size:13px;font-weight:500;cursor:pointer;border:none;border-radius:6px;padding:7px 14px;background:var(--violet);color:#fff}
  .btn.alt{background:#fff;color:var(--violet);border:1px solid var(--violet-line)}
  .btn:active{transform:scale(.98)}

  .canvas{padding:22px 14px;display:flex;justify-content:center}
  .page{width:794px;min-height:1123px;background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:2px;box-shadow:0 1px 6px rgba(0,0,0,.12);padding:54px 60px;display:flex;flex-direction:column;position:relative}
  .head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--jaune);padding-bottom:10px;margin-bottom:26px}
  .brand{display:flex;align-items:center}
  .brand img{height:42px;width:auto;display:block;-webkit-user-drag:none;user-drag:none}
  .meta{font-size:11px;color:var(--hint);text-align:right;line-height:1.5}

  .rows{display:flex;flex-direction:column;flex:1}
  .row{display:flex;gap:14px;align-items:stretch;break-inside:avoid;min-height:24px;position:relative;margin-bottom:14px}
  .row:last-child{margin-bottom:0}
  .row.sortable-ghost{opacity:.3}
  .row.file-drop-target{outline:2px dashed var(--violet);outline-offset:3px;border-radius:4px}

  /* Drop zone inter-row : invisible normalement, visible pendant un drag */
  .rowgap{height:0;border-radius:5px;margin:-14px 0 0;background:transparent;border:0 dashed var(--violet-line);transition:height .14s,margin .14s,border-width .14s,background .14s;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--violet);font-size:10px;opacity:0;pointer-events:none;letter-spacing:.4px}
  body.dragging .rowgap{height:30px;margin:6px 0;border-width:2px;background:var(--violet-soft);opacity:.95;pointer-events:auto}
  body.dragging .rowgap::before{content:"+ nouvelle ligne"}
  body.dragging .rowgap.sortable-drag-over,body.dragging .rowgap:hover{background:rgba(89,20,208,.18)}
  .rowgap.empty-trail{height:38px;margin:18px 0 0;border:2px dashed var(--violet-line);background:transparent;opacity:.55;pointer-events:auto;color:var(--violet)}
  .rowgap.empty-trail::before{content:"glisse un bloc, une image ou un fichier ici"}
  body.dragging .rowgap.empty-trail{opacity:1;background:var(--violet-soft)}

  .block{flex:1;min-width:0;position:relative;background:#fff;border-radius:6px}
  .block.sortable-ghost{opacity:.3}

  .block .bhandle{position:absolute;top:6px;left:6px;display:none;align-items:center;justify-content:center;z-index:4;width:18px;height:22px;border-radius:4px;cursor:grab;color:var(--muted);background:rgba(255,255,255,.92);border:1px solid var(--rule);padding:0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .block:hover .bhandle{display:flex}
  .block .bhandle:hover{color:var(--violet);border-color:var(--violet-line);background:#fff}
  .block .bhandle:active{cursor:grabbing}
  .block .bhandle svg{width:8px;height:12px}

  .block .ctrls{position:absolute;top:6px;right:6px;display:none;gap:4px;z-index:4}
  .block:hover .ctrls{display:flex}
  .block .ctrls .iconbtn{width:20px;height:22px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.92);border:1px solid var(--rule);border-radius:4px;cursor:pointer;color:var(--muted);box-shadow:0 1px 3px rgba(0,0,0,.06);padding:0}
  .block .ctrls .iconbtn:hover{color:var(--violet);border-color:var(--violet-line);background:#fff}
  .block .ctrls .iconbtn svg{width:10px;height:10px}

  /* Layout KV */
  .kv .ttl{font-size:14px;font-weight:600;color:var(--violet);margin:0 0 6px;padding-bottom:4px;border-bottom:1px solid var(--rule);text-transform:uppercase;letter-spacing:.4px;outline:none}
  .kv .grid{display:grid;grid-template-columns:1fr 180px;gap:14px;align-items:start}
  .kv .grid.full{grid-template-columns:1fr}
  .kv .body{font-size:13.5px;line-height:1.6;outline:none}
  .kv .side{font-size:11.5px;color:#444;background:var(--violet-soft);border-left:3px solid var(--violet);padding:8px 10px;border-radius:0 4px 4px 0;line-height:1.5;outline:none}

  /* Layout CARD */
  .card{border:1px solid var(--rule);border-radius:6px;overflow:hidden;height:100%}
  .card .hd{background:var(--violet-soft);padding:9px 12px;border-bottom:1px solid var(--rule)}
  .card .hd .t{font-size:14px;font-weight:600;color:var(--violet);line-height:1.25;outline:none}
  .card .hd .st{font-size:11.5px;color:var(--muted);margin-top:2px;outline:none}
  .card .bd{padding:11px 12px}
  .card .attr{margin:0 0 8px}
  .card .attr:last-child{margin-bottom:0}
  .card .attr .k{font-size:10.5px;font-weight:600;color:var(--violet);text-transform:uppercase;letter-spacing:.4px;margin-bottom:1px}
  .card .attr .v{font-size:13px;line-height:1.55;outline:none}

  /* contenteditable feedback */
  [contenteditable]{cursor:text}
  [contenteditable]:empty:before{content:attr(data-placeholder);color:var(--hint);opacity:.5}
  [contenteditable]:focus{background:#FFFCE5;box-shadow:0 0 0 2px var(--jaune);border-radius:2px}
  [contenteditable] ul{margin:4px 0;padding-left:20px}
  [contenteditable] li{margin:2px 0}

  /* Block IMAGE */
  .imgblock{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:6px;background:#fff;overflow:hidden;resize:both;min-width:120px;min-height:90px;max-width:100%;height:100%}
  .imgblock .imgwrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#FAFAFA}
  .imgblock .imgwrap img{width:100%;height:100%;object-fit:contain;display:block;-webkit-user-drag:none;user-drag:none;pointer-events:none}
  .imgblock .cap{font-size:11px;color:var(--muted);text-align:center;outline:none;min-height:0;padding:0}
  .imgblock .cap:not(:empty){padding:6px 10px;border-top:1px solid var(--rule)}
  .imgblock:hover .cap:empty::before{content:"+ légende";color:var(--hint);opacity:.45;display:block;padding:4px 10px;font-size:10px;border-top:1px dashed var(--rule)}
  .imgblock .cap:focus::before{content:none!important}

  /* Block TEXTE libre */
  .txtblock{font-size:13.5px;line-height:1.6;outline:none;min-height:36px;padding:8px 10px;border:1px dashed transparent;border-radius:5px}
  .txtblock:hover{border-color:var(--rule)}
  .txtblock:focus{border-color:var(--violet-line);border-style:solid;background:#fff}

  /* Fallback générique */
  .section{break-inside:avoid}
  .section h3{font-size:14px;font-weight:600;color:var(--violet);margin:0 0 7px;padding-bottom:4px;border-bottom:1px solid var(--rule)}
  .field{margin:0 0 9px}
  .field .k{font-size:11px;font-weight:600;color:var(--violet);text-transform:uppercase;letter-spacing:.5px}
  .field .v{font-size:13.5px;line-height:1.65;outline:none}

  .foot{display:flex;justify-content:space-between;border-top:1px solid var(--rule);margin-top:30px;padding-top:8px;font-size:10.5px;color:var(--hint)}
  .empty{color:var(--muted);font-size:14px;padding:40px;text-align:center}
  .err{color:#b00;font-size:12px;padding:10px 14px;background:#fff5f5;border:1px solid #f0caca;border-radius:6px;margin:6px 0;white-space:pre-wrap;font-family:Menlo,Consolas,monospace}

  /* Floating format toolbar */
  .fmttool{position:fixed;background:#2B2B2B;border-radius:6px;display:flex;gap:1px;padding:4px;z-index:80;box-shadow:0 3px 14px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .12s}
  .fmttool.show{opacity:1;pointer-events:auto}
  .fmttool button{background:transparent;color:#fff;border:none;width:30px;height:28px;border-radius:3px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;padding:0}
  .fmttool button:hover{background:#444}
  .fmttool button.active{background:var(--violet)}
  .fmttool button.b{font-weight:700}
  .fmttool button.i{font-style:italic}
  .fmttool button.u{text-decoration:underline}
  .fmttool button.s{text-decoration:line-through}
  .fmttool .sep{width:1px;background:#444;margin:2px 2px}
  .fmttool .swatch{position:relative}
  .fmttool .palette{position:absolute;top:32px;left:0;background:#2B2B2B;border-radius:4px;padding:5px;display:none;gap:4px;box-shadow:0 3px 10px rgba(0,0,0,.3)}
  .fmttool .swatch.open .palette{display:flex}
  .fmttool .palette span{width:18px;height:18px;border-radius:3px;cursor:pointer;border:1px solid #555}
  .fmttool .palette span:hover{transform:scale(1.1)}

  /* Undo toast */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2B2B2B;color:#fff;padding:11px 18px 13px;border-radius:6px;display:flex;gap:18px;align-items:center;font-size:13px;z-index:100;box-shadow:0 6px 22px rgba(0,0,0,.25);min-width:300px;overflow:hidden;animation:toast-in .18s ease-out}
  .toast .undo{cursor:pointer;color:var(--jaune);font-weight:600;letter-spacing:.3px;padding:2px 8px;border-radius:3px}
  .toast .undo:hover{background:rgba(255,221,11,.12)}
  .toast .progress{position:absolute;bottom:0;left:0;height:3px;background:var(--jaune);width:100%;transform-origin:left center;animation:toast-progress 5s linear forwards}
  @keyframes toast-in{from{transform:translate(-50%,12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
  @keyframes toast-progress{from{transform:scaleX(1)}to{transform:scaleX(0)}}

  /* Page-level file drop overlay */
  .page.file-hover{cursor:copy}
  .page.file-hover,.page.file-hover *{user-select:none!important}
  .page.file-hover::before{content:"Dépose pour insérer";position:absolute;inset:0;background:rgba(89,20,208,.06);border:3px dashed var(--violet);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--violet);font-weight:600;font-size:16px;letter-spacing:.5px;z-index:50;pointer-events:none}

  @media print{
    html,body{background:#fff}
    .bar,.fmttool,.toast{display:none!important}
    .canvas{padding:0}
    .page{width:auto;min-height:auto;box-shadow:none;border:none;border-radius:0;padding:0}
    .rowgap{display:none!important}
    .block .ctrls,.block .bhandle{display:none!important}
    [contenteditable]:focus{background:none;box-shadow:none}
    .imgblock{resize:none}
    .txtblock{border:none}
  }
  @page{size:A4;margin:16mm}
</style>
</head>
<body>
  <div class="bar">
    <div class="info" id="info">Connexion à Grist…</div>
    <div class="actions">
      <input type="file" id="fileinp" accept="image/*" style="display:none"/>
      <button class="btn alt" id="addtxt">+ Texte</button>
      <button class="btn alt" id="addimg">+ Image</button>
      <button class="btn alt" id="reset">Réinitialiser</button>
      <button class="btn alt" id="reload">Rafraîchir</button>
      <button class="btn" id="print">Imprimer / PDF A4</button>
    </div>
  </div>
  <div class="canvas">
    <div class="page" id="page">
      <div class="head">
        <div class="brand"><img src="WUBO-logo.png" alt="Wubo" draggable="false"/></div>
        <div class="meta" id="meta"></div>
      </div>
      <div class="rows" id="rows"></div>
      <div class="foot" id="foot"></div>
    </div>
  </div>

  <div class="fmttool" id="fmttool">
    <button class="b" data-cmd="bold" title="Gras (Ctrl+B)">B</button>
    <button class="i" data-cmd="italic" title="Italique (Ctrl+I)">I</button>
    <button class="u" data-cmd="underline" title="Souligné (Ctrl+U)">U</button>
    <button class="s" data-cmd="strikeThrough" title="Barré">S</button>
    <div class="sep"></div>
    <button id="hilite" title="Surligner (toggle)">
      <svg viewBox="0 0 14 14" width="14" height="14"><rect x="1" y="9" width="12" height="3" fill="#FFEB6E"/><path d="M3 8 L7 2 L11 8 Z" fill="none" stroke="#fff" stroke-width="1.3"/></svg>
    </button>
    <div class="swatch" id="colorswatch">
      <button title="Couleur du texte"><span style="font-weight:700;color:#fff">A</span><span style="display:inline-block;width:9px;height:3px;background:#FF3D3D;margin-left:1px"></span></button>
      <div class="palette">
        <span data-color="#2B2B2B" style="background:#2B2B2B"></span>
        <span data-color="#5914D0" style="background:#5914D0"></span>
        <span data-color="#0066D9" style="background:#0066D9"></span>
        <span data-color="#1B9E3F" style="background:#1B9E3F"></span>
        <span data-color="#FF3D3D" style="background:#FF3D3D"></span>
        <span data-color="#E67E00" style="background:#E67E00"></span>
        <span data-color="#7A7A7A" style="background:#7A7A7A"></span>
      </div>
    </div>
    <div class="sep"></div>
    <button data-cmd="insertUnorderedList" title="Liste à puces">
      <svg viewBox="0 0 14 14" width="14" height="14" fill="#fff"><circle cx="2" cy="3" r="1.2"/><circle cx="2" cy="7" r="1.2"/><circle cx="2" cy="11" r="1.2"/><rect x="5" y="2.3" width="8" height="1.4"/><rect x="5" y="6.3" width="8" height="1.4"/><rect x="5" y="10.3" width="8" height="1.4"/></svg>
    </button>
  </div>

  <div id="toast-host"></div>

<script>
(function(){
  "use strict";

  var TABLE_CONFIG = {
    "T01_identite":{label:"Identité",layout:"kv",title:["Rubrique","Rubrique"],body:["Contenu","Contenu"]},
    "T02_ecosysteme_produit":{label:"Écosystème produit",layout:"card",title:["Pilier","Pilier"],fields:[["Description","Description"],["Role_pedagogique","Rôle pédagogique"],["Exemples_concrets","Exemples concrets"],["Argument_parent","Argument parent"]]},
    "T03_univers_narratif":{label:"Univers narratif",layout:"card",title:["Element","Élément"],subtitle:["Type","Type"],fields:[["Description","Description"],["Role_dans_le_produit","Rôle dans le produit"]]},
    "T04_blocs_modulaires":{label:"Blocs modulaires",layout:"card",title:["Bloc","Bloc"],subtitle:["Audience","Audience"],fields:[["Formulation","Formulation"],["Usage_recommande","Usage recommandé"]]},
    "T05_pitchs":{label:"Pitchs",layout:"card",title:["Type_de_pitch","Type de pitch"],subtitle:["Duree_Format","Durée / Format"],fields:[["Formulation_complete","Formulation complète"],["Contexte_d_usage","Contexte d'usage"]]},
    "T06_business_model":{label:"Business model",layout:"kv",title:["Rubrique","Rubrique"],body:["Detail","Détail"],side:["Chiffres_cles","Chiffres clés"]},
    "T07_concurrence":{label:"Concurrence",layout:"card",title:["Concurrent","Concurrent"],subtitle:["Type","Type"],fields:[["Famille","Famille"],["Presence_FR","Présence FR"],["Prix","Prix"],["Forces","Forces"],["Faiblesses","Faiblesses"],["Positionnement_Wubo_vs","Positionnement Wubo vs"]]},
    "T08_equipe_legal":{label:"Équipe & légal",layout:"kv",title:["Rubrique","Rubrique"],body:["Detail","Détail"],side:["Role_Statut","Rôle / Statut"]},
    "T09_audiences":{label:"Audiences",layout:"card",title:["Audience","Audience"],subtitle:["Sous_segment","Sous-segment"],fields:[["Motivation_principale","Motivation principale"],["Frein_principal","Frein principal"],["Argument_massue","Argument massue"],["Canal_prioritaire","Canal prioritaire"],["Budget_moyen","Budget moyen"],["Profil_com","Profil com"]]},
    "T10_kits_roadmap":{label:"Kits & roadmap",layout:"card",title:["Kit","Kit"],subtitle:["Nom_capsule","Nom capsule"],fields:[["Statut","Statut"],["Thematique","Thématique"],["Notions_cles","Notions clés"],["Mascotte","Mascotte"],["COGS_cible_","COGS cible (€)"],["Prix_HT_","Prix HT (€)"],["Marge_brute_","Marge brute %"],["Lancement_prevu","Lancement prévu"]]},
    "T11_traction_metriques":{label:"Traction & métriques",layout:"card",title:["Metrique","Métrique"],subtitle:["Categorie","Catégorie"],fields:[["Valeur_actuelle_Preuve","Valeur actuelle / Preuve"],["Objectif_cible","Objectif cible"],["Source","Source"]]},
    "T12_canvas_frameworks":{label:"Canvas & frameworks",layout:"card",title:["Framework","Framework"],subtitle:["Bloc","Bloc"],fields:[["Contenu","Contenu"]]},
    "T13_risques":{label:"Risques",layout:"card",title:["Risque","Risque"],subtitle:["Categorie","Catégorie"],fields:[["Probabilite","Probabilité"],["Impact","Impact"],["Score","Score (PxI)"],["Mitigation","Plan de mitigation"],["Owner","Owner"],["Statut","Statut"]]}
  };

  var GLOBAL_SKIP=/^(Notes|manualSort|id|gristHelper)/i;
  var allRecords=[], tableId="", lastError="";
  var state={rows:[]};
  var sortables=[];
  var rowsEl=document.getElementById("rows");
  var infoEl=document.getElementById("info");
  var pageEl=document.getElementById("page");
  var toastHost=document.getElementById("toast-host");
  var currentToast=null;
  var isSortableDragging=false;
  var resizeObserver=null;
  var persistTimer=null;

  // ========================= UTILITIES =========================
  function el(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n;}
  function clear(n){while(n.firstChild)n.removeChild(n.firstChild);}
  function isEmpty(v){return v===null||v===undefined||v===""||(Array.isArray(v)&&v.length<=1);}
  function uid(){return Math.random().toString(36).slice(2,9);}
  function readVal(rec,id){if(rec[id]!==undefined)return rec[id];var keys=Object.keys(rec);for(var i=0;i<keys.length;i++)if(keys[i].toLowerCase()===id.toLowerCase())return rec[keys[i]];return undefined;}
  function recById(id){for(var i=0;i<allRecords.length;i++)if(allRecords[i].id===id)return allRecords[i];return null;}
  function fmtNum(v,id){
    if(typeof v!=="number")return String(v);
    if(/marge|pct|percent|%/i.test(id))return (v*100).toFixed(1).replace(/\.0$/,"")+" %";
    if(Number.isInteger(v))return String(v);
    return v.toLocaleString("fr-FR",{maximumFractionDigits:2});
  }
  function iconX(){var s='<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 2 L8 8 M8 2 L2 8"/></svg>';var d=document.createElement("div");d.innerHTML=s;return d.firstChild;}
  function iconDots(){var s='<svg viewBox="0 0 8 12" fill="currentColor"><circle cx="2" cy="2" r="1"/><circle cx="6" cy="2" r="1"/><circle cx="2" cy="6" r="1"/><circle cx="6" cy="6" r="1"/><circle cx="2" cy="10" r="1"/><circle cx="6" cy="10" r="1"/></svg>';var d=document.createElement("div");d.innerHTML=s;return d.firstChild;}

  // ========================= SAFE HTML =========================
  var ALLOWED_TAGS = {"B":1,"STRONG":1,"I":1,"EM":1,"U":1,"S":1,"STRIKE":1,"MARK":1,"SPAN":1,"BR":1,"UL":1,"OL":1,"LI":1,"DIV":1,"P":1,"FONT":1};
  function cleanDomNode(node){
    var children = Array.prototype.slice.call(node.childNodes);
    for(var i=0;i<children.length;i++){
      var c=children[i];
      if(c.nodeType===3)continue;
      if(c.nodeType!==1){c.remove();continue;}
      var tag=c.tagName.toUpperCase();
      if(!ALLOWED_TAGS[tag]){
        var p=c.parentNode;
        while(c.firstChild)p.insertBefore(c.firstChild,c);
        c.remove();continue;
      }
      if(tag==="FONT"){
        var col=c.getAttribute("color");
        var span=document.createElement("span");
        if(col)span.style.color=col;
        while(c.firstChild)span.appendChild(c.firstChild);
        c.replaceWith(span);
        cleanDomNode(span);
        continue;
      }
      var attrs=Array.prototype.slice.call(c.attributes);
      for(var j=0;j<attrs.length;j++){
        var a=attrs[j];
        if(a.name==="style"){
          var color=c.style.color, bg=c.style.backgroundColor, td=c.style.textDecoration, fw=c.style.fontWeight, fs=c.style.fontStyle;
          c.removeAttribute("style");
          if(color)c.style.color=color;
          if(bg&&bg!=="transparent"&&bg!=="rgba(0, 0, 0, 0)")c.style.backgroundColor=bg;
          if(td)c.style.textDecoration=td;
          if(fw)c.style.fontWeight=fw;
          if(fs)c.style.fontStyle=fs;
        }else{
          c.removeAttribute(a.name);
        }
      }
      cleanDomNode(c);
    }
  }
  function parseAndClean(html){
    var doc=new DOMParser().parseFromString("<div id='r'>"+(html||"")+"</div>","text/html");
    var root=doc.getElementById("r");
    if(!root)return document.createDocumentFragment();
    cleanDomNode(root);
    var frag=document.createDocumentFragment();
    while(root.firstChild)frag.appendChild(root.firstChild);
    return frag;
  }
  function setSafeHtml(node,html){
    while(node.firstChild)node.firstChild.remove();
    node.appendChild(parseAndClean(html));
  }
  function getSafeHtml(node){
    var clone=node.cloneNode(true);
    cleanDomNode(clone);
    return clone.innerHTML;
  }
  function hasHtml(s){return typeof s==="string"&&/<[a-z!\/]/i.test(s);}
  function setContent(node,value){
    if(value==null){node.textContent="";return;}
    var str=String(value);
    if(hasHtml(str))setSafeHtml(node,str);
    else node.textContent=str;
  }
  function hasFormatting(html){return /<(b|i|u|s|strike|strong|em|mark|ul|ol|li|span|font)/i.test(html);}

  // ========================= INLINE EDIT (Grist) =========================
  function makeEditable(node,recId,colId){
    if(!node||recId==null||!colId)return;
    node.setAttribute("contenteditable","true");
    node.dataset.rec=String(recId);
    node.dataset.col=colId;
    node.dataset.orig=getSafeHtml(node);
    node.spellcheck=false;
    node.addEventListener("focus",function(){node.dataset.orig=getSafeHtml(node);});
    node.addEventListener("keydown",function(e){
      if(e.key==="Escape"){setSafeHtml(node,node.dataset.orig||"");node.blur();}
      if(e.key==="Enter"&&!e.shiftKey&&!isInList(node)){e.preventDefault();node.blur();}
    });
    node.addEventListener("blur",saveEdit);
  }
  function isInList(node){var s=window.getSelection();if(!s||!s.anchorNode)return false;var n=s.anchorNode.nodeType===1?s.anchorNode:s.anchorNode.parentNode;while(n&&n!==node){if(n.tagName==="LI")return true;n=n.parentNode;}return false;}
  function saveEdit(e){
    var node=e.target;
    var recId=parseInt(node.dataset.rec,10);
    var colId=node.dataset.col;
    var orig=node.dataset.orig||"";
    var now=getSafeHtml(node);
    if(now===orig)return;
    if(!grist||!grist.docApi||!grist.docApi.applyUserActions){
      lastError="API édition indisponible";updateInfo();
      setSafeHtml(node,orig);return;
    }
    var toStore = hasFormatting(now) ? now : node.textContent;
    var patch={};patch[colId]=toStore;
    grist.docApi.applyUserActions([["UpdateRecord",tableId,recId,patch]])
      .then(function(){node.dataset.orig=now;lastError="";updateInfo();})
      .catch(function(err){lastError="édition : "+(err&&err.message||err);updateInfo();setSafeHtml(node,orig);});
  }

  // ========================= FLOATING FMT TOOLBAR =========================
  var fmt = document.getElementById("fmttool");

  function getActiveEditable(){
    var s=window.getSelection();
    if(!s||s.rangeCount===0||s.isCollapsed)return null;
    var n=s.anchorNode;
    if(n&&n.nodeType===3)n=n.parentNode;
    while(n){if(n.hasAttribute&&n.getAttribute("contenteditable")==="true")return n;n=n.parentNode;}
    return null;
  }
  function showFmtToolbar(){
    var ed=getActiveEditable();
    if(!ed){hideFmtToolbar();return;}
    var s=window.getSelection();
    var rect=s.getRangeAt(0).getBoundingClientRect();
    if(rect.width===0&&rect.height===0){hideFmtToolbar();return;}
    fmt.classList.add("show");
    var tw=fmt.offsetWidth||230, th=fmt.offsetHeight||36;
    var x=Math.max(8,Math.min(window.innerWidth-tw-8, rect.left+rect.width/2-tw/2));
    var y=Math.max(8, rect.top-th-8);
    fmt.style.left=x+"px";
    fmt.style.top=y+"px";
  }
  function hideFmtToolbar(){fmt.classList.remove("show");document.getElementById("colorswatch").classList.remove("open");}
  document.addEventListener("selectionchange",function(){clearTimeout(window._fmtT);window._fmtT=setTimeout(showFmtToolbar,40);});
  document.addEventListener("mousedown",function(e){if(!fmt.contains(e.target))setTimeout(showFmtToolbar,80);});

  // Toolbar simple cmd buttons
  fmt.querySelectorAll("button[data-cmd]").forEach(function(btn){
    btn.addEventListener("mousedown",function(e){e.preventDefault();});
    btn.addEventListener("click",function(e){
      e.preventDefault();
      var cmd=btn.dataset.cmd;
      try{document.execCommand(cmd,false,undefined);}catch(err){}
      var ed=getActiveEditable();if(ed)ed.dispatchEvent(new Event("input"));
    });
  });

  // Highlight TOGGLE
  function isInHighlight(){
    var s=window.getSelection();
    if(!s||!s.anchorNode)return false;
    var n=s.anchorNode.nodeType===1?s.anchorNode:s.anchorNode.parentNode;
    while(n){
      if(n.style&&n.style.backgroundColor&&n.style.backgroundColor!==""&&n.style.backgroundColor!=="transparent"&&n.style.backgroundColor!=="rgba(0, 0, 0, 0)")return n;
      if(n.hasAttribute&&n.getAttribute("contenteditable")==="true")break;
      n=n.parentNode;
    }
    return null;
  }
  document.getElementById("hilite").addEventListener("mousedown",function(e){e.preventDefault();});
  document.getElementById("hilite").addEventListener("click",function(e){
    e.preventDefault();
    var hl=isInHighlight();
    if(hl){
      // Unwrap : clear backgroundColor (and remove span if empty)
      hl.style.backgroundColor="";
      if(!hl.getAttribute("style")||hl.getAttribute("style").trim()===""){
        // unwrap if span has no other styling
        if(hl.tagName==="SPAN"){
          var p=hl.parentNode;
          while(hl.firstChild)p.insertBefore(hl.firstChild,hl);
          hl.remove();
        }
      }
    }else{
      try{document.execCommand("hiliteColor",false,"#FFEB6E");}catch(err){
        try{document.execCommand("backColor",false,"#FFEB6E");}catch(err2){}
      }
    }
    var ed=getActiveEditable();if(ed)ed.dispatchEvent(new Event("input"));
  });

  // Color swatch
  var swatchEl=document.getElementById("colorswatch");
  swatchEl.querySelector("button").addEventListener("mousedown",function(e){e.preventDefault();});
  swatchEl.querySelector("button").addEventListener("click",function(e){e.preventDefault();swatchEl.classList.toggle("open");});
  swatchEl.querySelectorAll(".palette span").forEach(function(sp){
    sp.addEventListener("mousedown",function(e){e.preventDefault();});
    sp.addEventListener("click",function(e){
      e.preventDefault();
      try{document.execCommand("foreColor",false,sp.dataset.color);}catch(err){}
      swatchEl.classList.remove("open");
    });
  });

  // ========================= UNDO TOAST =========================
  function showUndoToast(msg, undoFn){
    dismissToast(true);
    var t=el("div","toast");
    var lbl=el("span",null,msg);
    var und=el("span","undo","Annuler");
    var prog=el("div","progress");
    t.appendChild(lbl);t.appendChild(und);t.appendChild(prog);
    toastHost.appendChild(t);
    var done=false;
    var timer=setTimeout(function(){if(!done){done=true;if(t.parentNode)t.parentNode.removeChild(t);currentToast=null;}},5000);
    und.addEventListener("click",function(){
      if(done)return;
      done=true;clearTimeout(timer);
      try{undoFn();}catch(e){}
      if(t.parentNode)t.parentNode.removeChild(t);
      currentToast=null;
      render();
    });
    currentToast={el:t,timer:timer,undo:und,done:function(){return done;}};
  }
  function dismissToast(commit){
    if(!currentToast)return;
    if(!currentToast.done()){
      clearTimeout(currentToast.timer);
      if(currentToast.el.parentNode)currentToast.el.parentNode.removeChild(currentToast.el);
    }
    currentToast=null;
  }

  // ========================= BLOCK BUILDERS =========================
  function attachUrlSync(id){if(grist&&grist.docApi&&grist.docApi.getAttachmentURL){try{return grist.docApi.getAttachmentURL(id);}catch(e){return null;}}return null;}

  function buildKVContent(rec,cfg){
    var w=el("div","kv");
    var t=readVal(rec,cfg.title[0]);
    var ttl=el("div","ttl");setContent(ttl,t);
    if(t!=null)makeEditable(ttl,rec.id,cfg.title[0]);
    w.appendChild(ttl);
    var hasSide=!!(cfg.side&&!isEmpty(readVal(rec,cfg.side[0])));
    var grid=el("div","grid"+(hasSide?"":" full"));
    var body=el("div","body");setContent(body,readVal(rec,cfg.body[0])||"");
    makeEditable(body,rec.id,cfg.body[0]);
    grid.appendChild(body);
    if(hasSide){
      var side=el("div","side");setContent(side,readVal(rec,cfg.side[0]));
      makeEditable(side,rec.id,cfg.side[0]);
      grid.appendChild(side);
    }
    w.appendChild(grid);
    return w;
  }
  function buildCardContent(rec,cfg){
    var w=el("div","card");
    var hd=el("div","hd");
    var t=readVal(rec,cfg.title[0]);
    var tn=el("div","t");setContent(tn,t);
    if(t!=null)makeEditable(tn,rec.id,cfg.title[0]);
    hd.appendChild(tn);
    if(cfg.subtitle){
      var st=readVal(rec,cfg.subtitle[0]);
      var stn=el("div","st");setContent(stn,st);
      if(!isEmpty(st))makeEditable(stn,rec.id,cfg.subtitle[0]);
      hd.appendChild(stn);
    }
    w.appendChild(hd);
    var bd=el("div","bd");
    for(var i=0;i<cfg.fields.length;i++){
      var id=cfg.fields[i][0], label=cfg.fields[i][1];
      var v=readVal(rec,id);
      if(isEmpty(v))continue;
      var a=el("div","attr");
      a.appendChild(el("div","k",label));
      if(typeof v==="number"){
        a.appendChild(el("div","v",fmtNum(v,id)));
      }else{
        var vn=el("div","v");setContent(vn,v);
        makeEditable(vn,rec.id,id);
        a.appendChild(vn);
      }
      bd.appendChild(a);
    }
    w.appendChild(bd);
    return w;
  }
  function buildAutoContent(rec){
    var w=el("div","section");
    var keys=Object.keys(rec).filter(function(k){return !GLOBAL_SKIP.test(k);});
    var titleKey=keys[0];
    w.appendChild(el("h3",null,titleKey?String(readVal(rec,titleKey)||titleKey):"Élément"));
    for(var i=1;i<keys.length;i++){
      var k=keys[i], v=rec[k];
      if(isEmpty(v))continue;
      var f=el("div","field");
      f.appendChild(el("div","k",k.replace(/_/g," ")));
      if(typeof v==="number")f.appendChild(el("div","v",fmtNum(v,k)));
      else{var vn=el("div","v");setContent(vn,v);makeEditable(vn,rec.id,k);f.appendChild(vn);}
      w.appendChild(f);
    }
    return w;
  }
  function buildRecordContent(rec){
    var cfg=TABLE_CONFIG[tableId];
    if(cfg&&cfg.layout==="kv")return buildKVContent(rec,cfg);
    if(cfg&&cfg.layout==="card")return buildCardContent(rec,cfg);
    return buildAutoContent(rec);
  }

  function buildImageContent(block){
    var w=el("div","imgblock");
    w.dataset.bkey=block.key;
    if(block.width)w.style.width=block.width+"px";
    if(block.height)w.style.height=block.height+"px";
    var wrap=el("div","imgwrap");
    var src=block.attId!=null?attachUrlSync(block.attId):(block.dataUrl||null);
    if(src){
      var img=document.createElement("img");
      img.src=src;
      img.alt=block.caption||"image";
      img.setAttribute("draggable","false");
      wrap.appendChild(img);
    }else{
      wrap.appendChild(el("div","cap","(image indisponible)"));
    }
    w.appendChild(wrap);
    var cap=el("div","cap",block.caption||"");
    cap.setAttribute("contenteditable","true");
    cap.spellcheck=false;
    cap.addEventListener("focus",function(){cap.dataset.orig=cap.textContent;});
    cap.addEventListener("blur",function(){block.caption=cap.textContent;persist();});
    cap.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();cap.blur();}});
    w.appendChild(cap);
    if(resizeObserver){try{resizeObserver.observe(w);}catch(e){}}
    return w;
  }

  function buildTextContent(block){
    var w=el("div","txtblock");
    w.dataset.bkey=block.key;
    w.setAttribute("contenteditable","true");
    w.spellcheck=false;
    w.dataset.placeholder="Écris ton texte ici…";
    setSafeHtml(w, block.html||"");
    w.addEventListener("focus",function(){w.dataset.orig=getSafeHtml(w);});
    w.addEventListener("blur",function(){
      var v=getSafeHtml(w);
      if(v!==block.html){block.html=v;persist();}
    });
    return w;
  }

  function buildBlockEl(block){
    block.key=block.key||uid();
    var b=el("div","block");
    b.dataset.bkey=block.key;
    var content=null;
    if(block.type==="record"){var r=recById(block.recId);if(!r)return null;content=buildRecordContent(r);}
    else if(block.type==="image")content=buildImageContent(block);
    else if(block.type==="text")content=buildTextContent(block);
    if(!content)return null;
    b.appendChild(content);
    var h=el("button","bhandle");h.type="button";h.title="Glisser pour déplacer ce bloc";
    h.appendChild(iconDots());
    h.addEventListener("click",function(e){e.preventDefault();});
    b.appendChild(h);
    var ctrls=el("div","ctrls");
    var x=el("button","iconbtn");x.type="button";x.title="Masquer ce bloc";
    x.appendChild(iconX());
    x.addEventListener("click",function(ev){ev.stopPropagation();ev.preventDefault();removeBlock(block.key);});
    ctrls.appendChild(x);
    b.appendChild(ctrls);
    return b;
  }

  function buildRowEl(row){
    row.id=row.id||uid();
    var r=el("div","row");
    r.dataset.rid=row.id;
    for(var i=0;i<row.blocks.length;i++){
      var be=buildBlockEl(row.blocks[i]);
      if(be)r.appendChild(be);
    }
    return r;
  }

  function buildGap(isTrail){
    var g=el("div","rowgap"+(isTrail?" empty-trail":""));
    return g;
  }

  function findRowByBlockKey(key){
    for(var i=0;i<state.rows.length;i++)for(var j=0;j<state.rows[i].blocks.length;j++)if(state.rows[i].blocks[j].key===key)return {row:i,col:j};
    return null;
  }

  function removeBlock(bkey){
    var loc=findRowByBlockKey(bkey);
    if(!loc)return;
    var snapshot=JSON.parse(JSON.stringify(state.rows));
    state.rows[loc.row].blocks.splice(loc.col,1);
    if(state.rows[loc.row].blocks.length===0)state.rows.splice(loc.row,1);
    persist();render();
    showUndoToast("Bloc masqué", function(){state.rows=snapshot;persist();});
  }

  function reconcileState(){
    var inState={};
    state.rows.forEach(function(r){r.blocks.forEach(function(b){if(b.type==="record")inState[b.recId]=true;b.key=b.key||uid();});});
    var validIds={};
    allRecords.forEach(function(rec){validIds[rec.id]=true;if(!inState[rec.id])state.rows.push({id:uid(),blocks:[{type:"record",recId:rec.id,key:uid()}]});});
    state.rows.forEach(function(r){r.blocks=r.blocks.filter(function(b){return b.type!=="record"||validIds[b.recId];});});
    state.rows=state.rows.filter(function(r){return r.blocks.length>0;});
  }

  function rebuildStateFromDOM(){
    var newRows=[];
    var blockMap={};
    state.rows.forEach(function(r){r.blocks.forEach(function(b){blockMap[b.key]=b;});});
    var children=rowsEl.children;
    for(var i=0;i<children.length;i++){
      var child=children[i];
      var blocks=[];
      var bEls=child.querySelectorAll(".block");
      for(var j=0;j<bEls.length;j++){
        var bk=bEls[j].dataset.bkey;
        if(blockMap[bk])blocks.push(blockMap[bk]);
      }
      if(!blocks.length)continue;
      if(child.classList.contains("row"))newRows.push({id:child.dataset.rid||uid(),blocks:blocks});
      else if(child.classList.contains("rowgap"))newRows.push({id:uid(),blocks:blocks});
    }
    state.rows=newRows;
  }

  function setupSortables(){
    sortables.forEach(function(s){try{s.destroy();}catch(e){}});
    sortables=[];
    if(typeof Sortable==="undefined")return;
    var common={
      group:"blocks",
      draggable:".block",
      handle:".bhandle",
      animation:150,
      ghostClass:"sortable-ghost",
      onStart:function(){isSortableDragging=true;document.body.classList.add("dragging");hideFmtToolbar();},
      onEnd:function(){isSortableDragging=false;document.body.classList.remove("dragging");rebuildStateFromDOM();persist();render();}
    };
    var rowEls=rowsEl.querySelectorAll(".row, .rowgap");
    rowEls.forEach(function(rEl){sortables.push(Sortable.create(rEl,common));});
  }

  function updateInfo(){
    var cfg=TABLE_CONFIG[tableId];
    var label=cfg?cfg.label:(tableId||"(table inconnue)");
    var n=allRecords.length;
    var visibleRec=0;state.rows.forEach(function(r){visibleRec+=r.blocks.filter(function(b){return b.type==="record";}).length;});
    var txt=label+" · "+visibleRec+"/"+n+" ligne"+(n>1?"s":"")+(cfg?"":" · auto");
    if(lastError)txt+=" · ⚠ "+lastError;
    infoEl.textContent=txt;
  }

  function renderMeta(){
    var meta=document.getElementById("meta");
    clear(meta);
    var d=new Date();
    var mm=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
    meta.appendChild(document.createTextNode(d.getDate()+" "+mm[d.getMonth()]+" "+d.getFullYear()));
  }
  function renderFoot(){
    var foot=document.getElementById("foot");
    clear(foot);
    var cfg=TABLE_CONFIG[tableId];
    var d=new Date();
    foot.appendChild(el("span",null,"Wubo · Strasbourg"));
    foot.appendChild(el("span",null,cfg?cfg.label:tableId));
    foot.appendChild(el("span",null,d.toLocaleDateString("fr-FR")));
  }

  function render(){
    try{
      reconcileState();
      renderMeta();
      renderFoot();
      updateInfo();
      // Setup resize observer once
      if(!resizeObserver&&typeof ResizeObserver!=="undefined"){
        resizeObserver=new ResizeObserver(function(entries){
          var changed=false;
          for(var i=0;i<entries.length;i++){
            var elem=entries[i].target;
            var bk=elem.dataset.bkey;
            if(!bk)continue;
            // find block in state
            for(var r=0;r<state.rows.length;r++){
              for(var c=0;c<state.rows[r].blocks.length;c++){
                var b=state.rows[r].blocks[c];
                if(b.key===bk&&b.type==="image"){
                  var nw=Math.round(entries[i].contentRect.width);
                  var nh=Math.round(entries[i].contentRect.height);
                  if(b.width!==nw||b.height!==nh){b.width=nw;b.height=nh;changed=true;}
                }
              }
            }
          }
          if(changed)schedulePersist();
        });
      }
      clear(rowsEl);
      if(lastError)rowsEl.appendChild(el("div","err","⚠ "+lastError));
      if(!allRecords.length&&!state.rows.length){rowsEl.appendChild(el("div","empty","Aucune ligne dans cette table. Ajoute des lignes côté Grist puis Rafraîchir."));return;}
      // Render: gap, row, gap, row, ..., trailing gap
      rowsEl.appendChild(buildGap(false));
      for(var i=0;i<state.rows.length;i++){
        var re=buildRowEl(state.rows[i]);
        if(re)rowsEl.appendChild(re);
        rowsEl.appendChild(buildGap(i===state.rows.length-1));
      }
      if(state.rows.length===0)rowsEl.appendChild(buildGap(true));
      setupSortables();
    }catch(e){
      lastError="render : "+(e&&e.message||e);
      updateInfo();
    }
  }

  // ========================= PERSIST / LOAD =========================
  function persist(){
    if(typeof grist==="undefined"||!grist.setOptions)return;
    try{grist.setOptions({rows:state.rows});}catch(e){lastError="persist : "+e.message;updateInfo();}
  }
  function schedulePersist(){clearTimeout(persistTimer);persistTimer=setTimeout(persist,300);}
  function loadStateFromOptions(opts){
    if(!opts||!opts.rows||!Array.isArray(opts.rows))return;
    var clean=[];
    for(var i=0;i<opts.rows.length;i++){
      var r=opts.rows[i];
      if(!r||!Array.isArray(r.blocks))continue;
      var blocks=[];
      for(var j=0;j<r.blocks.length;j++){
        var b=r.blocks[j];
        if(!b)continue;
        if(b.type==="record"&&typeof b.recId==="number")blocks.push({type:"record",recId:b.recId,key:b.key||uid()});
        else if(b.type==="image"&&(b.attId!=null||b.dataUrl))blocks.push({type:"image",attId:b.attId||null,dataUrl:b.dataUrl||null,caption:b.caption||"",width:b.width||null,height:b.height||null,key:b.key||uid()});
        else if(b.type==="text")blocks.push({type:"text",html:b.html||"",key:b.key||uid()});
      }
      if(blocks.length)clean.push({id:r.id||uid(),blocks:blocks});
    }
    state.rows=clean;
  }

  // ========================= IMAGE COMPRESS / INSERT =========================
  function readFileAsDataURL(file){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(fr.result);};fr.onerror=function(){rej(new Error("read"));};fr.readAsDataURL(file);});}
  function loadImg(src){return new Promise(function(res,rej){var i=new Image();i.onload=function(){res(i);};i.onerror=function(){rej(new Error("img"));};i.src=src;});}
  async function compressImage(file,maxDim){
    if(file.type==="image/svg+xml")return await readFileAsDataURL(file);
    var dataUrl=await readFileAsDataURL(file);
    var img=await loadImg(dataUrl);
    var w=img.width,h=img.height;
    if(w<=maxDim&&h<=maxDim&&file.size<500*1024)return dataUrl;
    if(w>=h){if(w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;}}else{if(h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;}}
    var c=document.createElement("canvas");c.width=w;c.height=h;
    c.getContext("2d").drawImage(img,0,0,w,h);
    // Preserve alpha for PNG/GIF/WebP, JPEG for JPG
    var keepAlpha=(file.type==="image/png"||file.type==="image/gif"||file.type==="image/webp");
    return c.toDataURL(keepAlpha?"image/png":"image/jpeg",keepAlpha?undefined:0.85);
  }
  async function insertImage(file, target){
    if(!file||!file.type||file.type.indexOf("image/")!==0){lastError="format image non supporté";updateInfo();return;}
    try{
      var attId=null;
      if(grist&&grist.docApi&&typeof grist.docApi.uploadAttachment==="function"){
        try{var res=await grist.docApi.uploadAttachment(file);attId=Array.isArray(res)?res[0]:res;}catch(e){attId=null;}
      }
      var block;
      if(attId){
        block={type:"image",attId:attId,caption:"",key:uid()};
      }else{
        var dataUrl=await compressImage(file,1600);
        if(!dataUrl){lastError="lecture image impossible";updateInfo();return;}
        block={type:"image",dataUrl:dataUrl,caption:"",key:uid()};
      }
      if(target && target.rowIdx!=null){state.rows[target.rowIdx].blocks.push(block);}
      else if(target && target.afterRowIdx!=null){state.rows.splice(target.afterRowIdx+1,0,{id:uid(),blocks:[block]});}
      else{state.rows.push({id:uid(),blocks:[block]});}
      persist();render();
      lastError="";updateInfo();
    }catch(e){lastError="image : "+(e&&e.message||e);updateInfo();}
  }

  // File drag & drop on page
  var dragCounter=0;
  function isFileDrag(e){if(!e.dataTransfer||!e.dataTransfer.types)return false;var t=e.dataTransfer.types;for(var i=0;i<t.length;i++)if(t[i]==="Files")return true;return false;}
  pageEl.addEventListener("dragenter",function(e){if(isSortableDragging||!isFileDrag(e))return;dragCounter++;pageEl.classList.add("file-hover");e.preventDefault();});
  pageEl.addEventListener("dragleave",function(e){if(isSortableDragging||!isFileDrag(e))return;dragCounter=Math.max(0,dragCounter-1);if(dragCounter===0){pageEl.classList.remove("file-hover");clearRowHilite();}});
  pageEl.addEventListener("dragover",function(e){
    if(isSortableDragging||!isFileDrag(e))return;
    e.preventDefault();
    clearRowHilite();
    var row=e.target.closest&&e.target.closest(".row");
    if(row)row.classList.add("file-drop-target");
  });
  function clearRowHilite(){var hi=rowsEl.querySelectorAll(".row.file-drop-target");for(var i=0;i<hi.length;i++)hi[i].classList.remove("file-drop-target");}
  pageEl.addEventListener("drop",async function(e){
    if(isSortableDragging||!isFileDrag(e))return;
    if(!e.dataTransfer||!e.dataTransfer.files||!e.dataTransfer.files.length)return;
    e.preventDefault();
    dragCounter=0;pageEl.classList.remove("file-hover");clearRowHilite();
    // Clear any text selection that may have been triggered
    try{window.getSelection().removeAllRanges();}catch(err){}
    var files=Array.prototype.filter.call(e.dataTransfer.files,function(f){return f.type&&f.type.indexOf("image/")===0;});
    if(!files.length){lastError="aucune image dans le drop";updateInfo();return;}
    var row=e.target.closest&&e.target.closest(".row");
    var gap=e.target.closest&&e.target.closest(".rowgap");
    var target=null;
    if(row){
      var rid=row.dataset.rid;
      for(var i=0;i<state.rows.length;i++)if(state.rows[i].id===rid){target={rowIdx:i};break;}
    }else if(gap){
      // figure out position : find previous .row in DOM
      var prev=gap.previousElementSibling, idx=-1;
      while(prev){if(prev.classList.contains("row")){var pid=prev.dataset.rid;for(var k=0;k<state.rows.length;k++)if(state.rows[k].id===pid){idx=k;break;}break;}prev=prev.previousElementSibling;}
      target={afterRowIdx:idx};
    }
    for(var k=0;k<files.length;k++){await insertImage(files[k], target);}
  });

  function pickImage(){document.getElementById("fileinp").click();}
  function onFileChange(e){
    var file=e.target.files&&e.target.files[0];
    e.target.value="";
    if(!file)return;
    insertImage(file, null);
  }

  // ========================= TEXTE LIBRE =========================
  function addTextBlock(){
    var block={type:"text",html:"",key:uid()};
    state.rows.push({id:uid(),blocks:[block]});
    persist();render();
    // focus le nouveau bloc
    setTimeout(function(){
      var els=rowsEl.querySelectorAll(".txtblock");
      if(els.length){var last=els[els.length-1];last.focus();}
    },50);
  }

  // ========================= RESET =========================
  function resetLayout(){
    var snapshot=JSON.parse(JSON.stringify(state.rows));
    state.rows=[];
    persist();render();
    showUndoToast("Mise en page réinitialisée", function(){state.rows=snapshot;persist();});
  }

  // ========================= BUTTONS =========================
  document.getElementById("print").addEventListener("click",function(){window.print();});
  document.getElementById("reload").addEventListener("click",function(){lastError="";render();});
  document.getElementById("addimg").addEventListener("click",pickImage);
  document.getElementById("addtxt").addEventListener("click",addTextBlock);
  document.getElementById("fileinp").addEventListener("change",onFileChange);
  document.getElementById("reset").addEventListener("click",resetLayout);

  // ========================= INIT =========================
  if(typeof grist==="undefined"){
    infoEl.textContent="Hors Grist · ouvre cette URL comme Custom Widget";
    rowsEl.appendChild(el("div","empty","Ouvre cette page comme widget personnalisé dans Grist (Custom + Full document access)."));
    return;
  }
  try{grist.ready({requiredAccess:"full"});}catch(e){lastError="ready : "+e.message;}
  grist.onRecords(function(records){try{allRecords=records||[];render();}catch(e){lastError="onRecords : "+e.message;updateInfo();}});
  if(grist.onOptions)grist.onOptions(function(opts){try{loadStateFromOptions(opts);render();}catch(e){lastError="onOptions : "+e.message;updateInfo();}});
  try{grist.getTable&&grist.getTable().getTableId().then(function(id){tableId=id;render();}).catch(function(e){lastError="getTableId : "+e.message;updateInfo();});}catch(e){lastError="getTable : "+e.message;updateInfo();}
})();
</script>
</body>
</html>
